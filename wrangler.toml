name = "studio"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "studio_db"
database_id = "5f3b76cb-a1ef-4577-ab50-e831f7358913"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "studio-uploads"

[vars]
ADMIN_EMAIL = "laotouerle@outlook.com"
RESEND_FROM_EMAIL = "MangaTalk <noreply@1258099.xyz>"

# RESEND_API_KEY is a SECRET, not committed here. Set it with:
#   npx wrangler secret put RESEND_API_KEY
# or in the Cloudflare dashboard: Workers & Pages -> studio -> Settings -> Variables and Secrets.
